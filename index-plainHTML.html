<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ingreso de Personas - HTML Plano </title>
</head>
<body>
    <section id="body">
        <h2> Ingreso de Personas (HTML Plain) </h2>
        <button id="body_btNuevaPersona"> Nueva Persona </button>
        <hr> 
        <div>
            Ingreso menor: <span id="body_lblObtenerIngresoMenor"> 0 </span>
        </div>
        <div>
            Ingreso promedio: <span id="body_lblCalcularPromedio"> 0 </span>
        </div>
    </section>


    <section id="persona" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15x; width: 300px;">
        <h5 id="persona_lblPersona"> Procesar Persona </h5>
        <div>
            <label> Nombre:
                <input type="text" id="persona_inNombre" placeholder="Ej: José">
            </label>
        </div>
        <div>
            <label> Ingreso:
                <input type="text" id="persona_inIngreso" placeholder="Ej: 1000">
            </label>
        </div>
        <br>
        <button id="persona_btAceptar"> Aceptar </button>
        <button id="persona_btCancelar"> Cancelar </button>
    </section>

    <script type="module">
        import cGrupo from "./dist/controllers/cGrupo.js";
        import cPersona from "./dist/controllers/cPersona.js";

        import vGrupoPlain from "./dist/views/vGrupoPlain.js";
        import vPersona from "./dist/views/vPersonaPlain.js";

        const vistaGrupo = new vGrupoPlain();
        const vistaPersona = new vPersona();

        const controladorPersona = new cPersona(vistaPersona);
        new cGrupo(vistaGrupo, controladorPersona);
    </script>

</body>
</html>
