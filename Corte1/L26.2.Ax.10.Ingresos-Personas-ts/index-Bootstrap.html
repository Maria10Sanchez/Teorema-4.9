<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de personas (Bootstrap) </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>
    <div id="app-bootstrap" class="container mt-5">
        <h2> Ingreso de personas (Bootstrap) </h2>
        <button type="button" class="btn btn-primary" id="body_btNuevaPersona"> Nueva Persona</button>
        <hr>
        <div class="alert alert-info">
            <div> Ingreso menor: <span id="body_lblObtenerIngresoMenor" class="fw-bold">0</span></div>
            <div> Ingreso promedio: <span id="body_lblCalcularPromedio" class="fw-bold">0</span></div>
        </div>
    </div>


    <div class="modal fade" id="persona" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"> Procesar Persona </h5>
                </div>
                <div class="modal-body">
                    <label class="form-label"> Nombre: </label>
                    <input type="string" class="form-control" id="persona_inNombre">
                    <label class="form-label"> Ingreso: </label>
                    <input type="number" class="form-control" id="persona_inIngreso">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-success" id="persona_btAceptar"> Aceptar </button>
                    <button type="button" class="btn btn-secondary" id="persona_btCancelar"> Cancelar </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import cGrupo from "./dist/controllers/cGrupo.js";
        import cPersona from "./dist/controllers/cPersona.js";

        import vGrupoBootstrap from "./dist/views/vGrupoBootstrap.js";
        import vPersonaBootstrap from "./dist/views/vPersonaBootstrap.js";

        const vistaGrupo = new vGrupoBootstrap();
        const vistaPersona = new vPersonaBootstrap();

        const controladorPersona = new cPersona(vistaPersona);
        new cGrupo(vistaGrupo, controladorPersona);
    </script>

</body>
</html>
