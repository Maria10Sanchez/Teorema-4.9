<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda - HTML Plano</title>
</head>

<body>

  <section id="body">
    <h2>Gestión de Tienda (HTML Plano)</h2>
    <button id="body_btNuevoArticulo">Nuevo artículo</button>
    <hr>
    <div>
      <p>Ganancia Total: <span id="body_lblGananciaTotal">0$</span></p>
      <p>Código del artículo con mayor precio de venta: <span id="body_lblCodigoMayorPrecio">0</span></p>
    </div>
  </section>

  <section id="articulo" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5 id="articulo_lblArticulo">Procesar Artí­culo</h5>
    <div>
      <label>Código:
        <input type="number" id="articulo_inCodigo" placeholder="Ej: 888">
      </label>
    </div>
    <div>
      <label>Costo ($):
        <input type="number" id="articulo_inCosto" placeholder="Ej: 10">
      </label>
    </div>
    <div>
      <label>Precio de Venta ($):
        <input type="number" id="articulo_inPrecio" placeholder="Ej: 15">
      </label>
    </div>
    <br>
    <button id="articulo_btCancelar">Cancelar</button>
    <button id="articulo_btAceptar">Aceptar</button>
  </section>

  <script type="module">
    import cTienda from "./dist/controllers/cTienda.js";
    import cArticulo from "./dist/controllers/cArticulo.js";

    import vTiendaPlain from "./dist/views/vTiendaPlain.js";
    import vArticuloPlain from "./dist/views/vArticuloPlain.js";

    const vistaTienda = new vTiendaPlain();
    const vistaArticulo = new vArticuloPlain();

    const controladorArticulo = new cArticulo(vistaArticulo);
    new cTienda(vistaTienda, controladorArticulo);
  </script>
</body>

</html>
